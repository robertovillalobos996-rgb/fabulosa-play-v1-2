<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fabulosa Player</title>
    <style>
        body { margin: 0; background: black; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        video { width: 100%; height: 100%; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <video id="video" controls autoplay></video>
    <script>
        const params = new URLSearchParams(window.location.search);
        let src = decodeURIComponent(params.get('src'));
        const video = document.getElementById('video');

        // Usamos un proxy público de CORS para evitar el bloqueo del navegador
        const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(src);

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(proxyUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        }
    </script>
</body>
</html>
